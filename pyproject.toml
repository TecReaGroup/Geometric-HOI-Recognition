[project]
name = "geometric-hoi"
version = "0.1.0"
description = "RTMPose and object keypoint based video HOI recognition."
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26,<3", "opencv-python>=4.10", "torch>=2.6,<3", "torchvision>=0.21,<1",
    "torch-geometric>=2.6", "ultralytics>=8.4", "rtmlib>=0.0.13",
    "onnxruntime-gpu[cuda,cudnn]>=1.21,<1.27", "scipy>=1.14", "pillow>=11",
]

[project.scripts]
geometric-hoi = "geometric_hoi.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.17.0",
    "pytest>=8.4.0",
    "pytest-cov>=6.2.0",
    "ruff>=0.12.0",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
cache-dir = ".uv-cache"
# RTMLib's CPU distribution shares files with the GPU distribution.
exclude-dependencies = ["onnxruntime"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.build-backend]
module-name = "geometric_hoi"
module-root = "src"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "ARG",
    "B",
    "C4",
    "E",
    "F",
    "I",
    "N",
    "PERF",
    "PIE",
    "PTH",
    "RUF",
    "SIM",
    "UP",
    "W",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
pretty = true
show_error_codes = true
warn_unreachable = true

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=python_template",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=80",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["python_template"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
