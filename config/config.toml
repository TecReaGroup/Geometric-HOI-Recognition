[model]
# "2g-gcn" or "geovis-gnn"
name = "2g-gcn"
hidden_size = 128
device = "cuda:0"

[feature]
object_weight = "data/model/yolo26-pose/best.pt"
person_detector = "yolo26m"
person_pose = "rtmw-x"
workspace_mb = 1024
object_class = 0
object_point_index = [0, 1]
confidence = 0.3
sample_fps = 10.0

[train]
video_dir = "data/video"
window_frames = 16
stride_frames = 8
validation_fraction = 0.2
epochs = 40
batch_size = 8
learning_rate = 0.0001
seed = 42

[run]
action_name = "target_action"
threshold = 0.5
log_interval_seconds = 1.0

[camera]
driver = "UsbCamera"
deviceId = 0
backend = "dshow"
colorImageSizeX = 1920
colorImageSizeY = 1080
fps = 30
fourcc = "MJPG"
frameInterval = 0.033
timeout_seconds = 5.0
